name: Keep Render awake

on:
  schedule:
    # JST 8:00〜23:55(cronはUTC指定のため、JST 8時 = UTC 23時)
    - cron: "*/5 23,0-14 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /up
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 60 \
            -o /dev/null -w "%{http_code}\n" \
            "${RENDER_APP_URL%/}/up"
